server:
  port: 8085

spring:
  config:
    import: "configserver:"
  profiles:
    active: dev
  application:
    name: user-service
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: true
      discovery:
        enabled: true
        service-id: config-server

# JWT configuration
# Secret must be >= 256 bits (32+ chars) for HS256
# In production, load this from Vault / Config Server — never hardcode
jwt:
  secret: "ecommerce-user-service-jwt-secret-key-must-be-32-chars-min"
  expiration-ms: 86400000   # 24 hours in milliseconds
