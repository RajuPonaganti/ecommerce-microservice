server:
  port: 8888
spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI}
          default-label: main
          username: ${CONFIG_GIT_USERNAME}
          password:  ${CONFIG_GIT_PASSWORD}
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
management:
  endpoints:
    web:
      exposure:
        include: "*"
