server:
  port: 8086

spring:
  config:
    import: "configserver:"
  profiles:
    active: dev
  application:
    name: payment-service
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: true
      discovery:
        enabled: true
        service-id: config-server

# Payment gateway credentials (test keys seeded by MerchantCredentialsSeeder)
payment:
  gateway:
    api-key: pgw_test_ecomm_abc123xyz789
    api-secret: ecomm_secret_do_not_use_in_prod
    merchant-id: MERCH_ECOMM_001

# DB + JPA
#spring:
#  datasource:
#    url: jdbc:postgresql://localhost:5432/payment_service_db
#    username: postgres
#    password: root
#  jpa:
#    hibernate:
#      ddl-auto: update
#    show-sql: true
#    open-in-view: false

  # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ecommerce.payment.events"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
