server:
  port: 8081

spring:
  profiles:
    active: dev
  application:
    name: inventory-service
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: false
      label: main
      discovery:
        enabled: true
        service-id: config-server

  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_service_db
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        retries: 2147483647
        max.in.flight.requests.per.connection: 5
        spring.json.add.type.headers: true
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Ignore __TypeId__ header — use local event classes instead
        # This prevents "Cannot convert from [String] to [com.ecommerce.commons.X]" errors
        # when the producer and consumer are in different packages
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "com.ecommerce.inventory.events"
        # Map incoming type headers to local classes explicitly
        spring.json.type.mapping: >
          com.ecommerce.commons.OrderCreatedEvent:com.ecommerce.inventory.events.OrderCreatedEvent,
          com.ecommerce.order.events.OrderCreatedEvent:com.ecommerce.inventory.events.OrderCreatedEvent,
          com.ecommerce.payment.events.PaymentCompletedEvent:com.ecommerce.inventory.events.PaymentCompletedEvent,
          com.ecommerce.payment.events.InventoryReleaseRequestedEvent:com.ecommerce.inventory.events.InventoryReleaseRequestedEvent
